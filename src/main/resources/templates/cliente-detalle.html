<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Detalle del Cliente')}"></head>
<body>
    <div class="ml-layout">
        <aside th:replace="~{fragments :: sidebar('clientes')}"></aside>
        <div class="ml-main">
                <header th:replace="~{fragments :: topbar('Detalle del Paciente')}"></header>

                <main class="ml-content">
                    <div class="alert alert-success alert-dismissible fade show" role="status" th:if="${mensaje}">
                        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensaje}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>
                    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 ml-page-head">
                        <div>
                            <span class="ml-eyebrow">Ficha de paciente</span>
                            <h1 th:text="${cliente.nombres + ' ' + cliente.apellidos}">Paciente</h1>
                            <p>Información detallada del paciente registrado.</p>
                        </div>
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/clientes}">
                                <i class="bi bi-arrow-left me-1"></i> Volver al listado
                            </a>
                            <a class="btn btn-primary" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">
                                <i class="bi bi-pencil-square me-1"></i> Editar datos
                            </a>
                        </div>
                    </div>

                    <div class="card p-4">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <span class="ml-field-label">ID CLIENTE</span>
                                <p class="fs-5 fw-bold text-dark mb-0" th:text="${cliente.id}"></p>
                            </div>
                            <div class="col-md-3">
                                <span class="ml-field-label">DOCUMENTO DNI</span>
                                <p class="fs-5 fw-bold font-monospace text-dark mb-0" th:text="${cliente.dni}"></p>
                            </div>
                            <div class="col-md-3">
                                <span class="ml-field-label">TELÉFONO</span>
                                <p class="fs-5 text-dark mb-0" th:text="${cliente.telefono != null ? cliente.telefono : 'No registrado'}"
                                   th:classappend="${cliente.telefono == null} ? 'text-body-secondary fst-italic fs-6' : ''"></p>
                            </div>
                            <div class="col-md-3">
                                <span class="ml-field-label">ESTADO</span>
                                <div>
                                    <span class="badge fs-6 mt-1" th:classappend="${cliente.activo ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${cliente.activo ? 'Activo' : 'Inactivo'}"></span>
                                </div>
                            </div>
                            <div class="col-12"><hr class="my-2"></div>
                            <div class="col-md-6">
                                <span class="ml-field-label">NOMBRES COMPLETOS</span>
                                <p class="fs-5 text-dark mb-0" th:text="${cliente.nombres}"></p>
                            </div>
                            <div class="col-md-6">
                                <span class="ml-field-label">APELLIDOS</span>
                                <p class="fs-5 text-dark mb-0" th:text="${cliente.apellidos}"></p>
                            </div>
                            <div class="col-12">
                                <span class="ml-field-label">DIRECCIÓN DOMICILIARIA</span>
                                <p class="fs-5 text-dark mb-0" th:text="${cliente.direccion != null ? cliente.direccion : 'No registrada'}"
                                   th:classappend="${cliente.direccion == null} ? 'text-body-secondary fst-italic fs-6' : ''"></p>
                            </div>
                        </div>
                    </div>
                </main>

                <footer class="ml-foot">Sistema de Gestión de Fórmulas Magistrales · MagistralLab &copy; 2026</footer>
        </div>
    </div>

    <th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
