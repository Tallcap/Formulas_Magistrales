<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo + ' · MagistralLab'}">MagistralLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

    <!-- Sidebar de Navegación -->
    <aside th:fragment="sidebar(activo)" id="sidebar"
           class="ml-sidebar offcanvas-lg offcanvas-start" tabindex="-1" aria-labelledby="sidebar-title">
        <div class="ml-sidebar__inner offcanvas-body">

            <div class="offcanvas-header p-0 d-lg-none mb-3">
                <h2 class="visually-hidden" id="sidebar-title">Menú principal</h2>
                <button type="button" class="btn-close btn-close-white ms-auto"
                        data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Cerrar menú"></button>
            </div>

            <a class="ml-brand ml-brand--lg" th:href="@{/dashboard}">
                <span class="ml-brand__mark" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 64 64">
                        <path d="M10 20h44l-5 30H15z" fill="currentColor"/>
                        <path d="M8 18h48v7H8zM29 5h7v19h-7z" fill="currentColor"/>
                        <circle cx="39" cy="13" r="5" fill="currentColor"/>
                    </svg>
                </span>
                <span class="ml-brand__text"><strong>Magistral</strong><span>Lab</span></span>
            </a>
            <p class="ml-sidebar__tag">Farmacia clínica</p>

            <nav class="ml-nav" aria-label="Navegación principal">
                <a class="ml-nav__link" th:classappend="${activo == 'dashboard'} ? 'is-active'"
                   th:attr="aria-current=${activo == 'dashboard'} ? 'page' : null" th:href="@{/dashboard}">
                    <i class="bi bi-house-door" aria-hidden="true"></i><span>Inicio</span>
                </a>
                <a class="ml-nav__link" th:classappend="${activo == 'formulas'} ? 'is-active'"
                   th:attr="aria-current=${activo == 'formulas'} ? 'page' : null" th:href="@{/formulas}">
                    <i class="bi bi-capsule" aria-hidden="true"></i><span>Fórmulas</span>
                </a>
                <a class="ml-nav__link" th:classappend="${activo == 'clientes'} ? 'is-active'"
                   th:attr="aria-current=${activo == 'clientes'} ? 'page' : null" th:href="@{/clientes}">
                    <i class="bi bi-people" aria-hidden="true"></i><span>Pacientes</span>
                </a>
                <span class="ml-nav__link is-soon" aria-disabled="true"><i class="bi bi-file-medical"></i><span>Recetas</span><em>Pronto</em></span>
                <span class="ml-nav__link is-soon" aria-disabled="true"><i class="bi bi-box-seam"></i><span>Inventario</span><em>Pronto</em></span>
                <span class="ml-nav__link is-soon" aria-disabled="true"><i class="bi bi-bar-chart"></i><span>Reportes</span><em>Pronto</em></span>
                <span class="ml-nav__link is-soon" aria-disabled="true"><i class="bi bi-gear"></i><span>Configuración</span><em>Pronto</em></span>
            </nav>

            <form class="ml-logout mt-auto" th:action="@{/logout}" method="post">
                <button type="submit" class="ml-logout__btn">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Cerrar sesión
                </button>
            </form>
        </div>
    </aside>

    <!-- Topbar Superior -->
    <header th:fragment="topbar(titulo)" class="ml-topbar">
        <button class="ml-topbar__menu d-lg-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Abrir menú">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <span class="ml-topbar__title" th:text="${titulo}">MagistralLab</span>
        <div class="ml-userchip ms-auto">
            <span class="ml-userchip__meta">
                <strong>Administrador</strong>
            </span>
            <span class="ml-avatar" aria-hidden="true">AD</span>
        </div>
    </header>

    <!-- Scripts compartidos -->
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/modales.js}"></script>
    </th:block>

</body>
</html>
