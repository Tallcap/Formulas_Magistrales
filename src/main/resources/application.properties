# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN (DWI)
# ===================================================================
spring.application.name=DWI
spring.config.import=optional:file:./DWI/application-local.properties,optional:file:./application-local.properties

# ===================================================================
# CONEXIÓN A BASE DE DATOS (PostgreSQL 18 - Puerto 5433)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/Magistral_Formulas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# La validación de Bean Validation se aplica en los controladores (@Valid), no en cada
# flush de Hibernate. Evita que un UPDATE no relacionado (ej. cambiar el estado) falle
# por datos antiguos que no cumplen reglas nuevas.
spring.jpa.properties.jakarta.persistence.validation.mode=none
server.error.include-message=never

# ===================================================================
# USUARIO ADMINISTRADOR POR DEFECTO (Se siembra en la BD)
# ===================================================================
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ===================================================================
# APICLOUD (Integración RENIEC - miapi.cloud)
# ===================================================================
apicloud.reniec.base-url=${RENIEC_API_URL:https://miapi.cloud/v1}
apicloud.reniec.token=${RENIEC_API_TOKEN:}
