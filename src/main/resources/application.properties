# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN (DWI)
# ===================================================================
spring.application.name=DWI
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# ===================================================================
# CONEXIÓN A BASE DE DATOS (PostgreSQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Formulas_magistrales}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.jakarta.persistence.validation.mode=none
server.error.include-message=never

# ===================================================================
# ZONA HORARIA
# ===================================================================
spring.jackson.time-zone=America/Lima

# ===================================================================
# APICLOUD (Integración RENIEC - miapi.cloud)
# ===================================================================
apicloud.reniec.base-url=${RENIEC_API_URL:https://miapi.cloud/v1}
apicloud.reniec.token=${RENIEC_API_TOKEN:}
